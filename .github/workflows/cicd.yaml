name: ci

on:
  push:
    paths:
      - 'src/**'
    branches:
      - master
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: anilkponnam/python-app:v${{ github.run_number }}
    outputs:
      image_tag: ${{ github.run_number }}
  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: update image tag in values.yaml
        run: |
          yaml_file="charts/values.yaml"
          image_tag="${{ needs.ci.outputs.image_tag }}"
          yq eval -i ".image.tag = \"v$image_tag\"" "$yaml_file"

      - name: commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update image tag to v${{ needs.ci.outputs.image_tag }}"
          branch: master
      - name: push changes
        uses: ad-m/github-push-action@v0.6.0

      - name: argoCD deploy
        uses: argoproj/argocd-action@v2
        with:
          argocd_server: ${{ vars.ARGOCD_SERVER }}
          argocd_username: ${{ vars.ARGOCD_USERNAME }}
          argocd_password: ${{ secrets.ARGOCD_PASSWORD }}
          app_name: python-app
          project_name: default
          namespace: python-app
        